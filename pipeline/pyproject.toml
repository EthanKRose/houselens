[project]
name = "houselens-pipeline"
version = "0.1.0"
description = "HouseLens data pipeline: fetch, normalize, validate and export U.S. housing series."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "duckdb",
    "pandera[polars]",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["houselens_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["houselens_pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
