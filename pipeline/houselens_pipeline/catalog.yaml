  - {metric_id: price_index, label: House price index, unit: index, higher_is: up}
  - {metric_id: median_sale_price, label: Median sale price, unit: usd, higher_is: up}
  - {metric_id: typical_home_value, label: Typical home value, unit: usd, higher_is: up}
  - {metric_id: rent_index, label: Rent index, unit: usd, higher_is: up}
  - {metric_id: cpi_index, label: CPI index, unit: index, higher_is: up}
  - {metric_id: mortgage_rate_30y, label: 30-year fixed mortgage rate, unit: pct, higher_is: down}
  - {metric_id: housing_starts, label: Housing starts, unit: count, higher_is: neutral}
  - {metric_id: median_list_price, label: Median list price, unit: usd, higher_is: up}
  - {metric_id: median_list_ppsf, label: Median list price per square foot, unit: usd, higher_is: up}
  - {metric_id: active_listings, label: Active listings, unit: count, higher_is: neutral}
  - {metric_id: days_on_market, label: Days on market, unit: days, higher_is: neutral}
  - {metric_id: price_reduced_share, label: Share of listings with price cuts, unit: pct, higher_is: neutral}

# vendor_key may be a |-joined list that consumers split: zillow zhvi parts, or fred metro
# FREDID=CBSA pairs.
series:
  - series_id: fred.cs.national.sa
    name: "Case-Shiller home prices, national (seasonally adjusted)"
    summary: "A national home price index from S&P. It compares what the same houses sold for each time they sold again (a \"repeat-sales\" index), so it tracks price changes, not prices. Seasonally adjusted: the pattern that repeats every year is removed."
    source_id: fred
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: CSUSHPISA
    fixed_geo_id: US
    methodology_md: >-
      S&P CoreLogic Case-Shiller national index, a value-weighted arithmetic repeat-sales index
      published as a three-month moving average. Purchase prices come mostly from county
      assessor and recorder data and include jumbo and cash sales; refinances are excluded, as
      are new homes. Published with roughly a two-month lag, with revisions limited to about the
      latest two years. It is thin in non-disclosure states, where deeds do not record prices,
      so it is weaker there.
  - series_id: fred.cs.national.nsa
    name: "Case-Shiller home prices, national (not seasonally adjusted)"
    summary: "The same S&P repeat-sales home price index, without seasonal adjustment, so the pattern that repeats every year is still in it. Compare it only with other series that are not seasonally adjusted."
    source_id: fred
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: false
    frequency: monthly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: CSUSHPINSA
    fixed_geo_id: US
    methodology_md: >-
      The not seasonally adjusted version of the Case-Shiller national index, a value-weighted
      arithmetic repeat-sales index published as a three-month moving average. Do not compare
      it directly with seasonally adjusted series, since mixing them creates false divergence.
      Roughly two-month lag, excludes new homes, and is weaker in non-disclosure states where
      deeds do not record prices.
  - series_id: fred.cs.20city.sa
    name: "Case-Shiller home prices, 20-city (seasonally adjusted)"
    summary: "S&P's repeat-sales home price index for 20 large metro areas combined. It is not a national index."
    source_id: fred
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: SPCS20RSA
    fixed_geo_id: US
    methodology_md: >-
      The Case-Shiller 20-city composite is a composite of 20 metros, not a national index.
      It is a value-weighted arithmetic repeat-sales index, a three-month moving average with
      about a two-month lag. It excludes new homes and is thinner for metros in non-disclosure
      states such as Texas.
  - series_id: fred.cs.metro.sa
    name: "Case-Shiller home prices, metro (seasonally adjusted)"
    summary: "S&P's repeat-sales home price index for one of 20 large metro areas. S&P draws metro borders a little differently from the official Census metro areas."
    source_id: fred
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: "ATXRSA=12060|BOXRSA=14460|CRXRSA=16740|CHXRSA=16980|CEXRSA=17410|DAXRSA=19100|DNXRSA=19740|DEXRSA=19820|LVXRSA=29820|LXXRSA=31080|MIXRSA=33100|MNXRSA=33460|NYXRSA=35620|PHXRSA=38060|POXRSA=38900|SDXRSA=41740|SFXRSA=41860|SEXRSA=42660|TPXRSA=45300|WDXRSA=47900"
    fixed_geo_id: null
    methodology_md: >-
      Case-Shiller metro-area indices for the 20 metros, value-weighted arithmetic repeat sales
      as a three-month moving average with about a two-month lag. S&P's metro area definition
      differs from the OMB CBSA, so metros are mapped to the nearest CBSA code and are not
      identical areas. Weaker in non-disclosure states, including the Texas metros, where
      deeds do not record prices.
  - series_id: fred.pmms.30y.nsa
    name: "30-year fixed mortgage rate"
    summary: "The average interest rate on a 30-year fixed-rate mortgage, from Freddie Mac's weekly mortgage survey. National only."
    source_id: fred
    metric_id: mortgage_rate_30y
    method_family: survey
    market: finance
    seasonal_adj: false
    frequency: weekly
    typical_lag_days: 7
    release_date_kind: first_seen
    vendor_key: MORTGAGE30US
    fixed_geo_id: US
    methodology_md: >-
      Freddie Mac Primary Mortgage Market Survey weekly average of 30-year fixed rates,
      published on Thursdays. National only, and covers conforming loans only.
  - series_id: fred.starts.total.sa
    name: "Housing starts"
    summary: "How many new homes builders started building, from the Census Bureau. These are survey estimates: they can be off by a lot and are revised later."
    source_id: fred
    metric_id: housing_starts
    method_family: survey
    market: construction
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 21
    release_date_kind: first_seen
    vendor_key: HOUST
    fixed_geo_id: US
    methodology_md: >-
      Census Bureau (with HUD) New Residential Construction, from the Survey of Construction.
      Released about 2 to 4 weeks after the month, national and regional. It has large sampling
      error, is revised in later months and annually, and the 2025 shutdown delayed releases
      (November 2025 data moved to Feb. 18, 2026).
  - series_id: fred.cpi.rent.sa
    name: "Consumer prices: rent"
    summary: "The rent part of the government's Consumer Price Index, from the Bureau of Labor Statistics, built from rents of about 8,000 homes. It moves slowly: changes in market rents show up here about a year later."
    source_id: fred
    metric_id: cpi_index
    method_family: survey
    market: rent
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 14
    release_date_kind: first_seen
    vendor_key: CUSR0000SEHA
    fixed_geo_id: US
    methodology_md: >-
      BLS CPI rent of primary residence, built from about 8,000 rental unit quotes each month in
      six panels, each priced twice a year. It lags the market by roughly 12 months. Rents for
      October 2025 were carried forward from April 2025, producing unchanged index values for
      October because of the shutdown; the distortion unwound when the panel was re-surveyed
      in April 2026.
  - series_id: fred.cpi.oer.sa
    name: "Consumer prices: owners' equivalent rent"
    summary: "The government's estimate of what homeowners would pay to rent their own home, built from the same rent data as CPI rent. It is a big part of the Consumer Price Index and, like CPI rent, trails market rents by about a year."
    source_id: fred
    metric_id: cpi_index
    method_family: survey
    market: rent
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 14
    release_date_kind: first_seen
    vendor_key: CUSR0000SEHC
    fixed_geo_id: US
    methodology_md: >-
      BLS CPI owners' equivalent rent (OER), derived from the rent sample, and 26.204% of the
      CPI-U per BLS's December 2025 relative-importance weights. It lags the market by roughly
      12 months. Rents for October 2025 were carried forward from April 2025, giving unchanged
      OER index values for October; BLS researchers called no October price change an unlikely economic reality.
  - series_id: fhfa.hpi.po.m.sa
    name: "FHFA home prices, purchase-only (monthly)"
    summary: "A repeat-sales home price index from the Federal Housing Finance Agency, built from homes with Fannie Mae or Freddie Mac mortgages. Purchase-only means it uses sale prices, not refinance appraisals."
    source_id: fhfa
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: "purchase-only|monthly|USA or Census Division|index_sa"
    fixed_geo_id: null
    methodology_md: >-
      FHFA purchase-only House Price Index for the nation and Census divisions, a geometric
      weighted repeat-sales index modified from Case-Shiller. It uses conforming, conventional
      Fannie Mae and Freddie Mac loans, with no jumbo loans, and restricts condos, co-ops,
      multi-unit properties and PUDs. Data arrive with about a two-month lag and new sale pairs
      revise prior periods.
  - series_id: fhfa.hpi.po.q.sa
    name: "FHFA home prices, purchase-only (quarterly)"
    summary: "The FHFA purchase-only repeat-sales home price index for states, updated every three months. It uses homes with Fannie Mae or Freddie Mac mortgages and sale prices only."
    source_id: fhfa
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: true
    frequency: quarterly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: "purchase-only|quarterly|State|index_sa"
    fixed_geo_id: null
    methodology_md: >-
      FHFA purchase-only House Price Index at the state level, published quarterly. A geometric
      weighted repeat-sales index using conforming, conventional Fannie Mae and Freddie Mac loans
      only, with no jumbo loans, and it restricts condos, co-ops, multi-unit properties and PUDs.
      About a two-month lag, and revised as new sale pairs arrive.
  - series_id: fhfa.hpi.at.q.nsa
    name: "FHFA home prices, all sales and refinances (quarterly)"
    summary: "FHFA's repeat-sales home price index for metro areas, updated every three months. Unlike the purchase-only index, it also uses appraisals made when owners refinance. Not seasonally adjusted."
    source_id: fhfa
    metric_id: price_index
    method_family: repeat_sales
    market: sale
    seasonal_adj: false
    frequency: quarterly
    typical_lag_days: 60
    release_date_kind: first_seen
    vendor_key: "all-transactions|quarterly|MSA|index_nsa"
    fixed_geo_id: null
    methodology_md: >-
      FHFA all-transactions House Price Index for metropolitan areas (CBSA), published
      quarterly and not seasonally adjusted. Unlike purchase-only and Case-Shiller, the
      all-transactions index includes refinance appraisals. Geometric repeat sales on conforming,
      conventional Fannie Mae and Freddie Mac loans only, about a two-month lag, revised as new
      pairs arrive.
  - series_id: zillow.zhvi.all.mid.sa
    name: "Zillow typical home value"
    summary: "Zillow's estimate of a typical home's value: homes in the middle of the price range (35th to 65th percentile), based on Zillow's automated Zestimate valuations. It covers all homes, not only ones that sold."
    source_id: zillow
    metric_id: typical_home_value
    method_family: hedonic_avm
    market: sale
    tier: mid
    seasonal_adj: true
    frequency: monthly
    typical_lag_days: 30
    release_date_kind: first_seen
    vendor_key: zhvi_metro|zhvi_state|zhvi_zip
    fixed_geo_id: null
    methodology_md: >-
      Zillow Home Value Index, a smoothed, seasonally adjusted typical value (35th to 65th
      percentile) derived from the Zestimate. It covers all homes but inherits automated
      valuation model error, which is worse in non-disclosure states such as Texas where
      deeds do not record prices. Weaker there. Release date is the date HouseLens first saw
      the file.
