    name: "Zillow typical home value, 1 bedroom"
    summary: "Zillow's typical value (35th to 65th percentile) for homes with 1 bedroom, by ZIP code, based on Zillow's automated Zestimate valuations. Use it to compare a home with others of the same size nearby."
    source_id: zillow
