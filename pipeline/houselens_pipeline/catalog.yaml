sources:
  - source_id: fred
    name: Federal Reserve Economic Data (FRED)
    publisher: Federal Reserve Bank of St. Louis
    homepage_url: https://fred.stlouisfed.org
    access_method: api
    license_note: >-
      Mostly public domain, but some series are copyrighted by their owner (for example
      Case-Shiller); attribute the original owner.
    attribution: "Data: FRED, Federal Reserve Bank of St. Louis; original sources S&P CoreLogic Case-Shiller (data: Cotality, formerly CoreLogic), Freddie Mac, U.S. Census Bureau and U.S. Bureau of Labor Statistics."
    enabled: true
  - source_id: fhfa
    name: FHFA House Price Index
    publisher: Federal Housing Finance Agency
    homepage_url: https://www.fhfa.gov/data/hpi
    access_method: file
    license_note: Public domain.
    attribution: "Data: Federal Housing Finance Agency, House Price Index."
    enabled: true
  - source_id: zillow
    name: Zillow Research Data
    publisher: Zillow Research
    homepage_url: https://www.zillow.com/research/data/
    access_method: file
    license_note: >-
      Free for public use with clear attribution. Zillow and Bridge APIs must never be used to
      build a stored database; only the Zillow Research CSV files are used.
    attribution: "Data: Zillow Research (ZHVI, ZORI), used with attribution."
    enabled: true
  - source_id: realtor
    name: Realtor.com Research Data
    publisher: Realtor.com Economic Research
    homepage_url: https://www.realtor.com/research/data/
    access_method: file
    license_note: >-
      Realtor.com research files are a sanctioned free route; scraping the portal violates its
      terms. Attribute the source.
    attribution: "Data: Realtor.com ® Economic Research."
    enabled: true
  - source_id: redfin
    name: Redfin Data Center
    publisher: Redfin (Rocket Companies)
    homepage_url: https://www.redfin.com/news/data-center/
    access_method: manual_drop
    license_note: >-
      Terms must be reviewed; attribute Redfin and do not redistribute raw files. Manual drop
      only: the pipeline never fetches redfin.com, and written permission is needed before
      enabling.
    attribution: "Data: Redfin Data Center (Redfin, a Rocket Companies business)."
    enabled: false

